services:
  api-football-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "
      npm install -g supergateway &&
      supergateway --stdio 'node dist/server.js' --outputTransport streamableHttp --port 3000 --streamableHttpPath /mcp --cors --healthEndpoints /health
      "
    environment:
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
      - NODE_ENV=production
      - LOG_LEVEL=info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
