services:
  api-football-mcp:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      NODE_ENV: production
      LOG_LEVEL: info

    command: >
      sh -c "npm install -g supergateway &&
      supergateway --stdio 'node dist/server.js'
      --outputTransport streamableHttp
      --port 3000
      --streamableHttpPath /mcp
      --cors"

    expose:
      - "3000"

    labels:
      - "traefik.enable=true"
      - "traefik.http.services.api-football-mcp.loadbalancer.server.port=3000"
